[package]
name = "relay-desktop"
version = "2.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "=0.33.1"
nvml-wrapper = "0.11"
tempfile = "3"
base64 = "0.22"
image = {version="0.25", default-features=false, features=["png"]}
windows-sys = { version = "0.59", features = ["Win32_UI_Shell","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi","Win32_Foundation","Win32_Storage_FileSystem"] }

[profile.release]
strip = true

